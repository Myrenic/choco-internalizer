name: Sync Chocolatey packages

on:
  push:
    branches: [master]
    paths:
      - packages.txt
      - internal/**
      - aliases/**
      - scripts/sync-packages.sh
      - .github/workflows/sync.yml
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chocolatey-daily-sync
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and build once
        run: |
          go test -race ./...
          make build
      - id: matrix
        name: Build package matrix
        run: echo "packages=$(jq -Rsc 'split("\n") | map(select(length > 0 and (startswith("#") | not)))' packages.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload internalizer binary
        uses: actions/upload-artifact@v4
        with:
          name: choco-internalizer-linux
          path: bin/choco-internalizer
          retention-days: 1

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One runner per package: the community feed rate-limits per source IP,
      # and separate ephemeral runners mean separate budgets.
      max-parallel: 255
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download internalizer binary
        uses: actions/download-artifact@v4
        with:
          name: choco-internalizer-linux
          path: bin
      - name: Prepare binary
        run: chmod +x bin/choco-internalizer
      - name: Synchronize ${{ matrix.package }} dependency graph
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          CHOCO_REPOSITORY: https://artifacts.tuntelder.com/nuget/choco-internal-stage
          REPORT_NAME: ${{ matrix.package }}.md
        run: ./scripts/sync-packages.sh "${{ matrix.package }}"
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-sync-${{ matrix.package }}
          path: reports/${{ matrix.package }}.md
          if-no-files-found: warn
          retention-days: 30

  audit:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download package reports
        uses: actions/download-artifact@v4
        with:
          pattern: chocolatey-sync-*
          path: reports
          merge-multiple: true
      - name: Build aggregate report
        run: |
          total=$(find reports -name '*.md' -type f | wc -l)
          expected=$(awk 'NF && $1 !~ /^#/ { count++ } END { print count+0 }' packages.txt)
          failures=$(grep -l '⚠️' reports/*.md 2>/dev/null | wc -l)
          {
            echo '# Chocolatey synchronization audit'
            echo
            echo "Package roots checked: $total"
            echo "Package roots expected: $expected"
            echo "Compatibility failures: $failures"
            echo
            if (( failures > 0 )); then
              echo '## Packages requiring attention'
              echo
              grep '⚠️' reports/*.md || true
            else
              echo 'All package roots and their recursive dependencies synchronized successfully.'
            fi
            if (( total != expected )); then
              echo
              echo "⚠️ Missing reports: expected $expected but found $total."
            fi
          } | tee audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-sync-audit
          path: audit.md
          retention-days: 30
