name: Promotion gate

# Staging -> prod. A package is released only when the registry's promotion
# policy passes (ingested scan clean, staging cooldown elapsed) and the bytes it
# serves still hash to what it advertised. See scripts/gate.sh.
on:
  schedule:
    - cron: "45 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chocolatey-promotion-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate staged packages
        env:
          AK_TOKEN: ${{ secrets.AK_GATE_TOKEN }}
          STAGE_REPO: choco-internal-stage
          PROD_REPO: choco-internal-prod
        run: ./scripts/gate.sh
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-gate-report
          path: reports/gate.md
          if-no-files-found: warn
          retention-days: 90
